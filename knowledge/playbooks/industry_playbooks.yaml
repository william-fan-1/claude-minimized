# =============================================================================
# industry_playbooks.yaml — sector rulebooks
# Explaining Markets · Q3 2026 · version 0.3.0 · owner: Will · revised 2026-08-10
# =============================================================================
# Layers ON TOP of knowledge/playbooks/_global.yaml. Global principles and
# rules remain binding; industry rules supply directional KPI evidence and
# inform magnitude through the strength of the trigger and rationale.
#
# LOADER CONTRACT
#   Filter to the event's desired industry and inject industry rules into the
#   prompt
#
# ⚠ Most rules here are regime_2026Q3. This file has a shorter half-life than
#   _global.yaml by design. Treat confidence levels as provisional until the
#   outcomes ledger has real evidence behind them.
# =============================================================================

meta:
  version: 0.3.0
  title: Q2 2026 Earnings-Season Industry Playbooks
  as_of: "2026-08-07"
  revised: "2026-08-10"
  fiscal_quarter: Q2 2026
  purpose: Directional industry-specific evidence for forecasting cross-sectional stock reactions to earnings.
  calibration: >
    Industry rules identify the KPIs that matter and the direction of their
    evidence. They do not set an abnormal return or override global expectation,
    materiality, persistence, offset, or neutral principles. Use each rationale
    to judge why the signal matters and use the strength of the trigger relative
    to expectations to inform magnitude under the global calibration framework.
  application_policy:
    baseline: Start from the estimate implied by the applicable global rules.
    materiality_gate: >
      A trigger match supplies directional evidence only. Give it meaningful
      weight only when the important trigger clauses are explicitly supported
      and the development is material versus consensus, prior guidance, or the
      prior earnings path. Routine caution, one soft segment, normal hedging,
      or a small one-time item should have little or no effect.
    magnitude: >
      Adjust the global estimate in the indicated direction according to the
      size of the surprise, its persistence, its effect on the forward path,
      the economic logic in the rationale, and credible offsets. Stronger and
      more quantified evidence warrants a larger adjustment; expected, modest,
      transitory, or offset evidence warrants a smaller adjustment or none.
    partial_match: >
      If the industry evidence is incomplete, mixed, merely qualitative,
      expected, or substantially offset, preserve or shrink toward the global
      neutral estimate rather than forcing a directional move.
    interaction: >
      Collapse overlapping rules into one economic driver and do not add weak
      signals mechanically. Resolve conflicts using the global evidence
      hierarchy. If neither side clearly dominates, shrink toward the global
      neutral estimate. Several weak signals do not equal one severe signal.
  evidence_base:
    - Q3-2026-Sector-Research-Briefing.MD
    - EM-Diagnostics-Aug6.md
    - Public company earnings releases and market-reaction reporting available through 2026-08-07

quarter_calibration:

  - id: Q3-CAL-02
    trigger: >
      Event contains a material miss, guidance cut, or clear forward negative surprise
    calibration_effect: {downside_asymmetry: elevated, automatic_adjustment: false}
    rationale: >
      Explicit negative asymmetry this season: beats are rewarded, but even
      material misses are triggering severe selloffs against elevated
      expectations. This is a severity consideration, not a mechanical percentile deduction.
    confidence: medium

  - id: Q3-CAL-03
    trigger: >
      Management gives material commentary on input costs, fuel, freight,
      raw materials, or interest-rate sensitivity
    calibration_effect: {macro_sensitivity: elevated, automatic_adjustment: false}
    rationale: >
      An oil shock (WTI +77% YTD, sustained above $90/bbl) and a contested
      Fed path are the shared macro shock. Cost and rate commentary is being
      listened to far more closely than in a normal quarter. Commentary changes
      the estimate only when it materially alters the forward earnings path.
    confidence: medium

commercial_products:
  label: Commercial Products
  regime: Healthy industrial demand makes price-cost execution and margin conversion the differentiators.
  rules:
    - id: COMMERCIAL_PRODUCTS_1
      trigger: Volume growth with maintained or expanded margin despite tariffs and metals/energy inflation.
      implication: positive
      rationale: Caterpillar paired 24% revenue growth with a 21.9% adjusted operating margin; pass-through is scarcer than demand.
      confidence: high
    - id: COMMERCIAL_PRODUCTS_2
      trigger: Revenue or volume beats but margin guidance falls because price realization lags input costs.
      implication: negative
      rationale: With manufacturing expanding, negative price-cost increasingly reads as a company-specific execution failure.
      confidence: high
    - id: COMMERCIAL_PRODUCTS_3
      trigger: Backlog and orders rise with higher production or EPS guidance and controlled working capital.
      implication: positive
      rationale: Backlog conversion validates durable demand; advance ordering or cash absorption lowers its quality.
      confidence: medium_high

commercial_services:
  label: Commercial Services
  regime: Organic demand remains resilient, but labor productivity and measurable automation determine earnings quality.
  rules:
    - id: COMMERCIAL_SERVICES_1
      trigger: Organic growth accompanies stable retention, utilization, and labor-adjusted margin.
      implication: positive
      rationale: A productivity-backed beat is more repeatable than one produced by pricing or temporary labor underspend.
      confidence: medium
    - id: COMMERCIAL_SERVICES_2
      trigger: Revenue beats mainly through price while transactions, billable volume, or utilization decline.
      implication: negative
      rationale: Price-only growth is vulnerable when contracts reset and is poor evidence of healthy end demand.
      confidence: medium
    - id: COMMERCIAL_SERVICES_3
      trigger: AI or automation savings are quantified and flow into margin or guidance.
      implication: positive
      rationale: Investors reward visible cost-to-serve improvement, not unquantified AI narratives or recurring restructuring.
      confidence: medium

commercial_transportation:
  label: Commercial Transportation
  regime: Oil is the dominant shock; core volume and operating efficiency must be separated from fuel-surcharge revenue.
  rules:
    - id: COMMERCIAL_TRANSPORTATION_1
      trigger: Contractual pricing and fuel surcharges offset higher fuel costs while core volumes remain stable.
      implication: positive
      rationale: Formulaic cost recovery protects earnings without requiring a favorable oil forecast.
      confidence: high
    - id: COMMERCIAL_TRANSPORTATION_2
      trigger: Headline revenue rises on fuel surcharges while core shipments and operating ratio deteriorate.
      implication: negative
      rationale: Surcharge revenue is not demand and can conceal network or shipment weakness.
      confidence: high
    - id: COMMERCIAL_TRANSPORTATION_3
      trigger: Productivity and service gains improve the operating ratio and support raised guidance despite fuel inflation.
      implication: positive
      rationale: Durable network efficiency is more valuable than nominal revenue in an oil shock.
      confidence: high

other_business_products_and_services:
  label: Other Business Products and Services
  regime: Visibility and profit conversion matter more than acquisition-led or nominal growth.
  rules:
    - id: OTHER_BUSINESS_PRODUCTS_AND_SERVICES_1
      trigger: Recurring revenue, renewals, and backlog rise while gross margin holds.
      implication: positive
      rationale: Multi-quarter renewal strength gives more visibility than a one-quarter revenue beat.
      confidence: medium
    - id: OTHER_BUSINESS_PRODUCTS_AND_SERVICES_2
      trigger: Growth is acquisition-led while organic sales stagnate and leverage rises.
      implication: negative
      rationale: Two-sided rates reduce the value of debt-funded inorganic growth and increase execution risk.
      confidence: medium
    - id: OTHER_BUSINESS_PRODUCTS_AND_SERVICES_3
      trigger: Revenue guidance rises but profit guidance does not because tariffs, freight, or labor consume incremental sales.
      implication: negative
      rationale: Industrial investors are prioritizing margin pass-through over demand commentary.
      confidence: high

apparel_and_accessories:
  label: Apparel and Accessories
  regime: Brand heat, full-price DTC demand, and inventory cleanliness separate winners from promotion-dependent brands.
  rules:
    - id: APPAREL_AND_ACCESSORIES_1
      trigger: North American traffic and comps weaken and sales guidance is cut despite an expense-driven EPS beat.
      implication: negative
      rationale: Under Armour's revenue miss, 9% North America decline, and guide cut outweighed its EPS beat.
      confidence: high
    - id: APPAREL_AND_ACCESSORIES_2
      trigger: Broad-based DTC and e-commerce growth accompanies lower inventory, gross-margin expansion, and raised guidance.
      implication: positive
      rationale: Levi's 11% DTC growth, 19% e-commerce growth, and 7% inventory decline demonstrated profitable brand demand.
      confidence: high
    - id: APPAREL_AND_ACCESSORIES_3
      trigger: Growth depends on promotions or price reductions while assortment rationalization remains unfinished.
      implication: negative
      rationale: Persistent discounting signals weak brand equity and threatens the durability of margin recovery.
      confidence: medium_high

consumer_durables:
  label: Consumer Durables
  regime: Innovation can overcome weak discretionary demand, but housing, rates, tariffs, and unit elasticity remain major risks.
  rules:
    - id: CONSUMER_DURABLES_1
      trigger: New-product innovation drives multi-category growth and an upward sales and EPS revision.
      implication: positive
      rationale: SharkNinja's 22% sales growth and raised outlook showed that real innovation can create a replacement cycle.
      confidence: high
    - id: CONSUMER_DURABLES_2
      trigger: Big-ticket orders soften because of housing turnover, financing costs, or consumer caution.
      implication: negative
      rationale: Durable demand is unusually rate-sensitive while expected price increases compound affordability pressure.
      confidence: high
    - id: CONSUMER_DURABLES_3
      trigger: Tariff refunds or temporary price increases lift EPS while underlying units and recurring margin fail to improve.
      implication: negative
      rationale: One-time tariff benefits and accounting timing should be removed before extrapolating earnings quality.
      confidence: medium_high

consumer_non_durables:
  label: Consumer Non-Durables
  regime: Volume-supported organic growth is rewarded; price-only sales and input-cost leakage are not.
  rules:
    - id: CONSUMER_NON_DURABLES_1
      trigger: Organic growth is volume or concentrate-led, margins expand, and guidance rises.
      implication: positive
      rationale: Coca-Cola's volume-supported organic growth and margin expansion showed resilient underlying demand.
      confidence: high
    - id: CONSUMER_NON_DURABLES_2
      trigger: Sales rise primarily through pricing while unit volumes contract or trade-down accelerates.
      implication: negative
      rationale: Price-only growth signals elasticity, private-label substitution, and future promotional reinvestment.
      confidence: high
    - id: CONSUMER_NON_DURABLES_3
      trigger: Input inflation or distribution spending causes margin to decline despite positive volume.
      implication: negative
      rationale: Positive volume is insufficient if oil, packaging, and tariff costs prevent earnings conversion.
      confidence: medium_high

media:
  label: Media
  regime: Streaming monetization and franchise flywheels are rewarded; linear-ad erosion and cost-only EPS beats are punished.
  rules:
    - id: MEDIA_1
      trigger: Streaming engagement, advertising, and subscription monetization accelerate together.
      implication: positive
      rationale: Roku's beat across advertising and subscriptions showed scalable platform monetization.
      confidence: high
    - id: MEDIA_2
      trigger: Linear advertising or studio revenue falls sharply even if cost cuts produce an EPS beat.
      implication: negative
      rationale: Warner Bros. Discovery's surprise profit did not offset a 39% studio decline and 22% ad decline.
      confidence: high
    - id: MEDIA_3
      trigger: A hit franchise drives measurable lift across box office, streaming, merchandise, and experiences.
      implication: positive
      rationale: Cross-platform monetization improves content ROI and reduces dependence on a single release window.
      confidence: high

restaurants_hotels_and_leisure:
  label: Restaurants, Hotels and Leisure
  regime: Experiences and premium demand remain resilient, while mass-market restaurant traffic is increasingly value-sensitive.
  rules:
    - id: RESTAURANTS_HOTELS_AND_LEISURE_1
      trigger: Comparable sales or RevPAR and traffic beat while full-year growth or margin guidance rises.
      implication: positive
      rationale: Airbnb and Hyatt paired demand strength with forward confirmation rather than relying on a backward-looking beat.
      confidence: high
    - id: RESTAURANTS_HOTELS_AND_LEISURE_2
      trigger: Restaurant comps are price-led with weak traffic or management pivots toward value offers.
      implication: negative
      rationale: Promotion-dependent visits threaten restaurant-level margins and expose lower-income weakness.
      confidence: high
    - id: RESTAURANTS_HOTELS_AND_LEISURE_3
      trigger: Premium, international, or event demand offsets lower-income domestic weakness with stable margins.
      implication: positive
      rationale: Consumer demand is bifurcated rather than uniformly weak, favoring affluent and international exposure.
      confidence: medium_high

retail:
  label: Retail
  regime: Traffic, units, basket quality, value positioning, and inventory discipline outrank nominal sales growth.
  rules:
    - id: RETAIL_1
      trigger: Traffic, transactions, or units weaken and guidance falls even where price or mix preserves sales.
      implication: negative
      rationale: Paycheck-timed trips and smaller baskets make unit weakness a leading indicator of further pressure.
      confidence: high
    - id: RETAIL_2
      trigger: Share gains from value positioning accompany disciplined inventory and stable gross margin.
      implication: positive
      rationale: Inventory discipline distinguishes genuine share gains from promotions or channel stuffing.
      confidence: high
    - id: RETAIL_3
      trigger: Growth relies on tax-refund timing, BNPL usage, or promotion rather than repeatable traffic and units.
      implication: negative
      rationale: Borrowing- or timing-supported demand is less persistent and creates difficult comparisons.
      confidence: medium_high

services_non_financial:
  label: Services (Non-Financial)
  regime: Measurable AI productivity and recurring demand are rewarded; price-led revenue and weak utilization are discounted.
  rules:
    - id: SERVICES_NON_FINANCIAL_1
      trigger: AI or self-service automation improves conversion or resolution and flows into margin or guidance.
      implication: positive
      rationale: Airbnb's 45% automated issue resolution illustrates monetized operating leverage rather than AI narrative.
      confidence: medium_high
    - id: SERVICES_NON_FINANCIAL_2
      trigger: Bookings or utilization weakens among lower-income customers and forward demand is reduced.
      implication: negative
      rationale: Discretionary services have little inventory cushion, so weakening bookings rapidly create labor deleverage.
      confidence: medium_high
    - id: SERVICES_NON_FINANCIAL_3
      trigger: Revenue beats through price or pass-through fees while productivity, retention, or recurring bookings deteriorate.
      implication: negative
      rationale: Nominal service revenue is low quality when utilization and retention weaken.
      confidence: medium

transportation:
  label: Transportation
  regime: Fuel, unit revenue, premium mix, and capacity discipline determine whether record revenue converts into earnings.
  rules:
    - id: TRANSPORTATION_1
      trigger: Fuel pressure rises materially and EPS guidance is cut despite healthy revenue.
      implication: negative
      rationale: American Airlines' record revenue did not offset a fuel-driven earnings outlook cut.
      confidence: high
    - id: TRANSPORTATION_2
      trigger: Yield, RASM, and premium revenue outgrow capacity, enabling higher EPS guidance despite fuel inflation.
      implication: positive
      rationale: United's unit-revenue strength supported a guide raise despite nearly $6 billion of additional fuel cost.
      confidence: high
    - id: TRANSPORTATION_3
      trigger: Capacity expands without unit-revenue improvement or management discounts to fill seats.
      implication: negative
      rationale: Capacity is constructive only when yield and margins hold.
      confidence: high

other_consumer_products_and_services:
  label: Other Consumer Products and Services
  regime: Innovation-led organic demand matters more than price reversals, acquisitions, refunds, or event-driven growth.
  rules:
    - id: OTHER_CONSUMER_PRODUCTS_AND_SERVICES_1
      trigger: Innovation drives demand across several categories and management raises revenue and EPS guidance.
      implication: positive
      rationale: Broad new-product adoption is strong evidence that growth is company-specific rather than macro-driven.
      confidence: high
    - id: OTHER_CONSUMER_PRODUCTS_AND_SERVICES_2
      trigger: Management reverses price increases or adds promotions because consumers resist tariff-driven pricing.
      implication: negative
      rationale: Price reversals combine lower realization with inventory and markdown risk.
      confidence: high
    - id: OTHER_CONSUMER_PRODUCTS_AND_SERVICES_3
      trigger: Reported growth is acquisition-, refund-, or event-driven while the legacy business contracts.
      implication: negative
      rationale: Temporary and inorganic effects should be stripped out before extrapolating earnings.
      confidence: medium_high

energy_equipment:
  label: Energy Equipment
  regime: Contracted backlog and aftermarket mix are favored over speculative capacity built for the oil spike.
  rules:
    - id: ENERGY_EQUIPMENT_1
      trigger: Orders and backlog improve without speculative supplier capacity expansion.
      implication: positive
      rationale: E&P customers are preserving capital discipline, favoring suppliers with firm commitments.
      confidence: medium_high
    - id: ENERGY_EQUIPMENT_2
      trigger: Capex or inventory is raised ahead of firm customer commitments.
      implication: negative
      rationale: Suppliers betting on an E&P spending boom risk overcapacity because tracked upstream capex remains lower year over year.
      confidence: high
    - id: ENERGY_EQUIPMENT_3
      trigger: Pricing and recurring aftermarket mix offset steel, freight, and labor inflation.
      implication: positive
      rationale: Service mix and price-cost execution make margin improvement more durable than one-time shipments.
      confidence: medium_high

exploration_production_and_refining:
  label: Exploration, Production and Refining
  regime: Windfall cash return and operating gains are rewarded; peak-cycle capex expansion is punished.
  rules:
    - id: EXPLORATION_PRODUCTION_AND_REFINING_1
      trigger: Oil or refining windfall is returned through buybacks or dividends while capex stays flat or falls.
      implication: positive
      rationale: Capital discipline is the sector's clearest preference; Exxon paired $17.2 billion of FCF with $9.4 billion of distributions.
      confidence: high
    - id: EXPLORATION_PRODUCTION_AND_REFINING_2
      trigger: Capex rises to chase current prices without commensurate low-cost production or contracted returns.
      implication: negative
      rationale: Large multi-year commitments raise peak-cycle risk and reverse the industry's successful restraint.
      confidence: high
    - id: EXPLORATION_PRODUCTION_AND_REFINING_3
      trigger: Production or throughput guidance rises while unit costs and capex remain controlled.
      implication: positive
      rationale: Operational gains at ConocoPhillips and Chevron are more persistent than commodity-price beats alone.
      confidence: high

energy_services:
  label: Energy Services
  regime: International and offshore backlog plus service intensity matter more than assumptions of a U.S. shale rebound.
  rules:
    - id: ENERGY_SERVICES_1
      trigger: International or offshore backlog and pricing improve while North American activity remains disciplined.
      implication: positive
      rationale: Contracted activity is more durable than a spot-driven U.S. capex forecast.
      confidence: medium_high
    - id: ENERGY_SERVICES_2
      trigger: Guidance assumes sharply higher U.S. rigs or completions or adds capacity without customer commitments.
      implication: negative
      rationale: Tracked E&P capital investment is down 5% in 2026 despite higher oil.
      confidence: high
    - id: ENERGY_SERVICES_3
      trigger: Service intensity, utilization, and pricing lift margins even on flat rig counts.
      implication: positive
      rationale: Earnings growth without a volume boom validates technology mix and pricing power.
      confidence: medium

utilities:
  label: Utilities
  regime: Data-center load is real, but regulatory cost recovery and affordability outrank raw demand.
  rules:
    - id: UTILITIES_1
      trigger: A data-center load contract includes customer funding, minimum payments, and explicit regulatory recovery.
      implication: positive
      rationale: Long-duration take-or-pay terms convert load growth into financeable earnings and limit stranded-asset risk.
      confidence: high
    - id: UTILITIES_2
      trigger: Data-center capex or load forecasts rise without cost-allocation clarity or with concentration risk.
      implication: negative
      rationale: EIA forecast cuts and political affordability concerns make unprotected capex a liability.
      confidence: high
    - id: UTILITIES_3
      trigger: A favorable rate case supports reaffirmed EPS and FCF growth despite fuel inflation and higher rates.
      implication: positive
      rationale: Multi-year regulatory recovery determines whether demand and capex create shareholder value.
      confidence: high

other_energy:
  label: Other Energy
  regime: Fee-based cash flow, contracted projects, and balance-sheet-safe distributions are favored.
  rules:
    - id: OTHER_ENERGY_1
      trigger: Fee-based or inflation-linked EBITDA guidance rises without material commodity sensitivity.
      implication: positive
      rationale: Take-or-pay midstream cash flows continue to compound through oil and geopolitical volatility.
      confidence: high
    - id: OTHER_ENERGY_2
      trigger: An acquisition or project is supported by long-term contracts and remains leverage-neutral or quickly accretive.
      implication: positive
      rationale: Williams' contracted LNG-linked growth illustrates why financing discipline matters under unstable rates.
      confidence: medium_high
    - id: OTHER_ENERGY_3
      trigger: FCF converts into distribution growth or buybacks without sacrificing balance-sheet targets.
      implication: positive
      rationale: Formulaic cash returns are preferred to speculative reinvestment in the current energy regime.
      confidence: high

capital_markets_institutions:
  label: Capital Markets/Institutions
  regime: Forward pipelines and cash realization outrank episodic trading revenue and accounting marks.
  rules:
    - id: CAPITAL_MARKETS_INSTITUTIONS_1
      trigger: Investment-banking fees and announced pipelines accelerate without a material compensation-ratio increase.
      implication: positive
      rationale: M&A and underwriting backlogs reveal durable operating leverage beyond reported fees.
      confidence: high
    - id: CAPITAL_MARKETS_INSTITUTIONS_2
      trigger: Trading beats on volatility while client activity, financing balances, or wallet share weaken.
      implication: negative
      rationale: High dispersion supports trading temporarily but does not prove franchise gains.
      confidence: medium
    - id: CAPITAL_MARKETS_INSTITUTIONS_3
      trigger: Private-markets fundraising, realizations, fee-related earnings, or distributable earnings miss while marks remain optimistic.
      implication: negative
      rationale: Weak cash realization exposes a gap between marks and fee-bearing or distributable value.
      confidence: high

commercial_banks:
  label: Commercial Banks
  regime: Deposit pricing, NII trajectory, and forward credit costs dominate EPS and routine capital return.
  rules:
    - id: COMMERCIAL_BANKS_1
      trigger: NII or NIM guidance rises because deposit betas and funding costs stabilize rather than solely on a rate assumption.
      implication: positive
      rationale: Industry NIM fell from 3.30% to 3.22%, making funding normalization the key proof point.
      confidence: high
    - id: COMMERCIAL_BANKS_2
      trigger: >
        Provisions or criticized loans rise materially enough to worsen forward credit-cost
        guidance, or disclosed lower-FICO stress changes the expected loss path, despite an EPS beat.
      implication: negative
      rationale: Provision builds are forward warnings and matter more than current charge-offs in a benign broad-credit backdrop.
      confidence: high
    - id: COMMERCIAL_BANKS_3
      trigger: Loan growth slows and deposit costs stay sticky while management relies on buybacks to support EPS.
      implication: negative
      rationale: Bank buybacks are routine capital maintenance, not a substitute for weakening spread income.
      confidence: high

insurance:
  label: Insurance
  regime: Underlying underwriting profitability and reserve discipline outrank catastrophe noise and volume growth.
  rules:
    - id: INSURANCE_1
      trigger: The underlying or accident-year combined ratio beats while premium growth remains adequate.
      implication: positive
      rationale: Chubb and AIG showed that durable underwriting profitability is valued above catastrophe-distorted results.
      confidence: high
    - id: INSURANCE_2
      trigger: Catastrophe losses rise but pricing, reserves, and underlying loss trends remain intact.
      implication: positive
      rationale: Investors look through truly one-off catastrophe variance when core underwriting persists.
      confidence: high
    - id: INSURANCE_3
      trigger: Premium growth is obtained by relaxing discipline in softening commercial lines.
      implication: negative
      rationale: Growth below adequate pricing implies adverse future loss development.
      confidence: high

other_financial_services:
  label: Other Financial Services
  regime: Transaction quality and user durability matter more than nominal volume or cost-led fintech beats.
  rules:
    - id: OTHER_FINANCIAL_SERVICES_1
      trigger: Payment and cross-border volumes remain resilient with stable take rates and credit losses.
      implication: positive
      rationale: Real transaction growth is stronger evidence of consumer health than inflation-lifted nominal spending.
      confidence: medium_high
    - id: OTHER_FINANCIAL_SERVICES_2
      trigger: Fintech revenue beats through transaction-margin expansion while active accounts or branded share deteriorate.
      implication: negative
      rationale: Cost-led earnings without user or share growth have low persistence.
      confidence: high
    - id: OTHER_FINANCIAL_SERVICES_3
      trigger: Consumer lenders raise reserves or funding-cost assumptions for lower-FICO borrowers.
      implication: negative
      rationale: Digital and specialty lenders remain most exposed to the consumer-credit pocket still deteriorating.
      confidence: high

healthcare_devices_and_supplies:
  label: Healthcare Devices and Supplies
  regime: Procedure demand and installed-base recurring revenue are strong, but tariffs and components can erase volume upside.
  rules:
    - id: HEALTHCARE_DEVICES_AND_SUPPLIES_1
      trigger: Procedure volumes stay strong and organic-sales guidance rises without gross-margin sacrifice.
      implication: positive
      rationale: Procedure growth plus price-cost control supports multi-quarter medtech earnings persistence.
      confidence: high
    - id: HEALTHCARE_DEVICES_AND_SUPPLIES_2
      trigger: Sales beat through volume but tariff, freight, component, or memory costs reduce margin guidance.
      implication: negative
      rationale: High dispersion makes margin misses more important than device volume beats.
      confidence: medium_high
    - id: HEALTHCARE_DEVICES_AND_SUPPLIES_3
      trigger: Product adoption, installed-base placements, and recurring consumables accelerate together.
      implication: positive
      rationale: A larger installed base validates the product cycle and creates persistent recurring revenue.
      confidence: high

healthcare_services:
  label: Healthcare Services
  regime: Forward medical costs, labor productivity, and membership quality swamp backward-looking EPS.
  rules:
    - id: HEALTHCARE_SERVICES_1
      trigger: Medical-loss ratio or second-half utilization and risk-adjustment guidance deteriorates despite an EPS beat.
      implication: negative
      rationale: Oscar Health showed that forward claims risk can overwhelm a large reported beat.
      confidence: high
    - id: HEALTHCARE_SERVICES_2
      trigger: Admissions and procedures rise while labor expense per admission and agency staffing fall.
      implication: positive
      rationale: Volume plus labor productivity creates durable hospital EBITDA leverage.
      confidence: high
    - id: HEALTHCARE_SERVICES_3
      trigger: Membership growth depends on aggressive pricing or favorable risk selection while utilization assumptions worsen.
      implication: negative
      rationale: Low-quality membership can reverse through risk adjustment and later claims.
      confidence: high

healthcare_technology_systems:
  label: Healthcare Technology Systems
  regime: Contracted recurring growth and measurable AI workflow savings outrank services-heavy reported revenue.
  rules:
    - id: HEALTHCARE_TECHNOLOGY_SYSTEMS_1
      trigger: Bookings, backlog, and recurring subscriptions accelerate while implementation cycles shorten.
      implication: positive
      rationale: Faster conversion of provider demand into recurring revenue improves both visibility and cash efficiency.
      confidence: medium_high
    - id: HEALTHCARE_TECHNOLOGY_SYSTEMS_2
      trigger: AI produces paid module expansion, measurable adoption, or documented provider workflow savings.
      implication: positive
      rationale: The market now demands monetization proof rather than generic AI positioning.
      confidence: high
    - id: HEALTHCARE_TECHNOLOGY_SYSTEMS_3
      trigger: Revenue beats on services or implementation work while ARR, retention, or bookings slow.
      implication: negative
      rationale: Low-margin services cannot offset deterioration in the recurring software engine.
      confidence: high

pharmaceuticals_and_biotechnology:
  label: Pharmaceuticals and Biotechnology
  regime: GLP-1 volume versus price concessions, pipeline replacement, and binary biotech catalysts dominate.
  rules:
    - id: PHARMACEUTICALS_AND_BIOTECHNOLOGY_1
      trigger: GLP-1 volume and access gains exceed government or DTC price concessions and guidance rises.
      implication: positive
      rationale: Lilly and Novo reactions show that the market is explicitly adjudicating volume against a $2-3 billion pricing drag.
      confidence: high
    - id: PHARMACEUTICALS_AND_BIOTECHNOLOGY_2
      trigger: A favorable pivotal readout, regulatory decision, or launch materially increases probability-adjusted pipeline value.
      implication: positive
      rationale: For pre-profit biotech, a single catalyst can overwhelm the financial statements and belongs in the tails.
      confidence: high
    - id: PHARMACEUTICALS_AND_BIOTECHNOLOGY_3
      trigger: A current-product beat is offset by patent erosion without replacement-pipeline progress.
      implication: negative
      rationale: Investors capitalize replacement cash flows, not the final strong quarters before generic competition.
      confidence: high

other_healthcare:
  label: Other Healthcare
  regime: Orders, funded backlog conversion, reimbursement, and mix determine whether activity becomes durable cash flow.
  rules:
    - id: OTHER_HEALTHCARE_1
      trigger: Life-science tools orders recover with book-to-bill above one and raised guidance.
      implication: positive
      rationale: Order recovery confirms that the prolonged inventory and funding correction is ending.
      confidence: high
    - id: OTHER_HEALTHCARE_2
      trigger: CRO or CDMO backlog rises while cancellations or delayed starts reduce conversion guidance.
      implication: negative
      rationale: Backlog has low value when projects are unfunded, deferred, or cancelled.
      confidence: medium_high
    - id: OTHER_HEALTHCARE_3
      trigger: Diagnostics volume rises with stable reimbursement and better mix rather than low-margin pass-through testing.
      implication: positive
      rationale: Reimbursement and mix determine whether testing volume converts into persistent earnings.
      confidence: medium

communications_and_networking:
  label: Communications and Networking
  regime: AI networking is a bottleneck, but quantified orders, diversified customers, and margin preservation are required.
  rules:
    - id: COMMUNICATIONS_AND_NETWORKING_1
      trigger: AI and data-center networking revenue, orders, and guidance beat while margins hold.
      implication: positive
      rationale: Arista's 38% growth and above-consensus guide demonstrated direct, monetized infrastructure demand.
      confidence: high
    - id: COMMUNICATIONS_AND_NETWORKING_2
      trigger: Revenue beats while hyperscaler concentration rises or orders signal customer digestion.
      implication: negative
      rationale: Customer concentration and lumpiness reduce the persistence of otherwise strong AI revenue.
      confidence: medium_high
    - id: COMMUNICATIONS_AND_NETWORKING_3
      trigger: Backlog normalizes and product growth slows without offsetting security or subscription growth.
      implication: negative
      rationale: Post-shortage backlog conversion is not recurring demand.
      confidence: high

computer_hardware:
  label: Computer Hardware
  regime: AI-server growth must convert to cash and margin while memory inflation pressures assemblers.
  rules:
    - id: COMPUTER_HARDWARE_1
      trigger: AI-server revenue and backlog accelerate with improving cash conversion and margin guidance.
      implication: positive
      rationale: Investors reward AI revenue only when it produces earnings and cash rather than working-capital consumption.
      confidence: high
    - id: COMPUTER_HARDWARE_2
      trigger: DRAM or NAND inflation and shortages reduce device gross margin and cannot be passed through.
      implication: negative
      rationale: Hardware assemblers sit on the losing side of memory inflation.
      confidence: high
    - id: COMPUTER_HARDWARE_3
      trigger: Revenue is price-led while unit shipments, channel inventory, or end demand weaken.
      implication: negative
      rationale: Price increases mask elasticity and create difficult comparisons.
      confidence: high

semiconductors:
  label: Semiconductors
  regime: The strongest tape carries the highest bar; guidance magnitude, memory scarcity, and cyclical inflections dominate.
  rules:
    - id: SEMICONDUCTORS_1
      trigger: AI, HBM, or custom-accelerator guidance exceeds elevated consensus and implies sequential acceleration.
      implication: positive
      rationale: Broadcom showed that even rapid AI growth can sell off when forward guidance misses a very high bar.
      confidence: high
    - id: SEMICONDUCTORS_2
      trigger: Memory pricing, long-term contracts, and HBM mix rise without an offsetting supply response.
      implication: positive
      rationale: Persistent DRAM, NAND, and HBM scarcity makes producer price-mix gains unusually durable.
      confidence: high
    - id: SEMICONDUCTORS_3
      trigger: >
        Forward guidance falls materially below an elevated consensus or implied buy-side bar,
        or customer digestion and margin pressure interrupt the expected sequential acceleration.
      implication: negative
      rationale: In the strongest tape, a reported beat cannot offset a forward guide that breaks the expected acceleration path.
      confidence: high

it_services:
  label: IT Services
  regime: Forward bookings and value-capturing AI contracts outrank backlog revenue and cost-only margin beats.
  rules:
    - id: IT_SERVICES_1
      trigger: Bookings and book-to-bill improve with stable pricing and utilization.
      implication: positive
      rationale: Forward bookings confirm that discretionary transformation spending is returning.
      confidence: medium_high
    - id: IT_SERVICES_2
      trigger: Generative AI demand cannibalizes billable headcount faster than outcome-based revenue scales.
      implication: negative
      rationale: Productivity accrues to customers unless contract structure lets the provider capture value.
      confidence: high
    - id: IT_SERVICES_3
      trigger: Margins beat only through layoffs or subcontractor cuts while bookings and headcount decline.
      implication: negative
      rationale: Cost takeout has low persistence if the demand engine remains weak.
      confidence: high

software:
  label: Software
  regime: Seat-based models are structurally de-rating; retention, usage pricing, cRPO, and monetized AI matter most.
  rules:
    - id: SOFTWARE_1
      trigger: >
        Seat counts or net retention deteriorate materially and the change lowers forward
        revenue, cRPO, or guidance expectations, even if reported EPS and revenue beat.
      implication: negative
      rationale: AI-enabled customers are accomplishing more with fewer licenses, making seat compression structural.
      confidence: high
    - id: SOFTWARE_2
      trigger: Usage or outcome pricing produces accelerating cRPO, NRR, large deals, or AI ACV.
      implication: positive
      rationale: ServiceNow's cRPO and AI ACV showed how monetized AI can offset seat pressure.
      confidence: high
    - id: SOFTWARE_3
      trigger: >
        Reported results beat but billings, cRPO, or guidance fall below an elevated expectation
        bar or imply material forward deceleration. A merely in-line print is not sufficient by itself.
      implication: negative
      rationale: Datadog's reaction showed that in-line forward metrics can read as a miss in this tape.
      confidence: high

other_information_technology:
  label: Other Information Technology
  regime: Quantified AI monetization and efficient recurring growth are rewarded; unproven capex is penalized.
  rules:
    - id: OTHER_INFORMATION_TECHNOLOGY_1
      trigger: AI infrastructure, security, or platform demand accelerates revenue and guidance with larger customer cohorts.
      implication: positive
      rationale: Cloudflare showed that quantified monetization differentiates durable beneficiaries from generic AI claims.
      confidence: high
    - id: OTHER_INFORMATION_TECHNOLOGY_2
      trigger: AI capex rises materially without revenue visibility, funding clarity, or FCF support.
      implication: negative
      rationale: This quarter reverses the old response in which AI spending was automatically bullish.
      confidence: high
    - id: OTHER_INFORMATION_TECHNOLOGY_3
      trigger: ARR and remaining obligations accelerate while sales efficiency improves.
      implication: positive
      rationale: Mission-critical recurring demand plus improving acquisition economics supports durable growth.
      confidence: medium_high

agriculture:
  label: Agriculture
  regime: Channel inventory and farmer economics matter more than price-led revenue in a high-energy, high-rate environment.
  rules:
    - id: AGRICULTURE_1
      trigger: Equipment or input volumes stabilize and dealer inventories fall without discount-driven margin damage.
      implication: positive
      rationale: Inventory clearing and retail orders above shipments are the clearest evidence of a cyclical trough.
      confidence: medium
    - id: AGRICULTURE_2
      trigger: Sales beat is price-led while farmer demand, acreage economics, and volumes weaken.
      implication: negative
      rationale: Energy, fertilizer, and financing costs pressure farm budgets, making price-only growth low quality.
      confidence: medium_high
    - id: AGRICULTURE_3
      trigger: Production or dealer shipments are cut faster than end demand, protecting working capital and margins.
      implication: positive
      rationale: Disciplined destocking is more valuable than defending near-term revenue.
      confidence: medium

chemicals_and_gases:
  label: Chemicals and Gases
  regime: Price-cost, physical volume, and contracted project backlog separate durable earnings from commodity inflation.
  rules:
    - id: CHEMICALS_AND_GASES_1
      trigger: Pricing and productivity exceed energy and feedstock inflation while volumes remain stable or positive.
      implication: positive
      rationale: Linde paired price and volume growth with a 29.5% adjusted operating margin.
      confidence: high
    - id: CHEMICALS_AND_GASES_2
      trigger: Sales growth is overwhelmingly price-led while volume declines and maintenance costs rise.
      implication: negative
      rationale: Dow's 20% local-price increase against lower volume illustrates why nominal sales can mislead.
      confidence: high
    - id: CHEMICALS_AND_GASES_3
      trigger: Electronics, AI, manufacturing, or energy backlog supports a guide raise without disproportionate capex.
      implication: positive
      rationale: Contracted, take-or-pay projects create more valuable growth than uncommitted capacity.
      confidence: high

construction_non_wood:
  label: Construction (Non-Wood)
  regime: Infrastructure and data-center demand are healthy, but price-cost and funded-backlog quality determine value.
  rules:
    - id: CONSTRUCTION_NON_WOOD_1
      trigger: North American volumes and backlog rise while price-cost remains favorable.
      implication: positive
      rationale: Caterpillar's construction growth and margin expansion validate real demand plus operating leverage.
      confidence: high
    - id: CONSTRUCTION_NON_WOOD_2
      trigger: Revenue grows but margins compress from steel, cement, energy, freight, or tariffs.
      implication: negative
      rationale: Healthy demand makes failure to pass through costs appear company-specific.
      confidence: high
    - id: CONSTRUCTION_NON_WOOD_3
      trigger: Backlog rises while cancellations, financing delays, or working-capital use worsen.
      implication: negative
      rationale: Funded public and infrastructure work deserves more credit than speculative commercial backlog.
      confidence: medium_high

containers_and_packaging:
  label: Containers and Packaging
  regime: Box-price realization and synergy conversion must offset soft volume, maintenance, and recovered-fiber costs.
  rules:
    - id: CONTAINERS_AND_PACKAGING_1
      trigger: Containerboard or paper price increases flow into box pricing before fiber and energy costs rise.
      implication: positive
      rationale: Closing International Paper's lag between paper and box pricing is the central earnings lever.
      confidence: high
    - id: CONTAINERS_AND_PACKAGING_2
      trigger: Price-led sales are offset by soft volumes, maintenance, or conversion costs and lower segment profit.
      implication: negative
      rationale: Higher nominal pricing has little value if box demand and operating profit deteriorate.
      confidence: high
    - id: CONTAINERS_AND_PACKAGING_3
      trigger: Acquisition or restructuring synergies are realized in cash and margin while service levels hold.
      implication: positive
      rationale: A consolidating sector is being judged on realized savings rather than announced targets.
      confidence: medium_high

forestry:
  label: Forestry
  regime: Price plus shipment recovery is required; disciplined curtailments are preferred to capex into soft demand.
  rules:
    - id: FORESTRY_1
      trigger: Lumber or pulp realizations improve with stable shipments and lower conversion costs.
      implication: positive
      rationale: Price and volume together confirm tightening; price alone may reflect tariffs or curtailment.
      confidence: medium
    - id: FORESTRY_2
      trigger: Higher prices accompany falling volume, mill downtime, and fixed-cost under-absorption.
      implication: negative
      rationale: Price-led growth is low quality when utilization and cash conversion deteriorate.
      confidence: medium_high
    - id: FORESTRY_3
      trigger: Capacity curtailment materially reduces cash burn and inventory while capex stays restrained.
      implication: positive
      rationale: A disciplined supply response is preferable in a cyclical and energy-intensive business.
      confidence: medium

metals_minerals_and_mining:
  label: Metals, Minerals and Mining
  regime: Commodity price support is strong, but production, unit costs, and guide magnitude determine stock reactions.
  rules:
    - id: METALS_MINERALS_AND_MINING_1
      trigger: Higher commodity prices combine with production growth, raised sales guidance, and controlled unit costs.
      implication: positive
      rationale: Operating gains prove leverage beyond a pure commodity mark-to-market benefit.
      confidence: high
    - id: METALS_MINERALS_AND_MINING_2
      trigger: >
        Profit beats on commodity price alone while production misses and unit costs rise.
        An unchanged guide is only a mild negative unless investors clearly expected a raise.
      implication: negative
      rationale: Freeport and Aurubis reactions demonstrate that an elevated tape requires operational upside.
      confidence: high
    - id: METALS_MINERALS_AND_MINING_3
      trigger: Domestic protected producers realize price increases with strong shipments and margin expansion.
      implication: positive
      rationale: Protectionism favors domestic steel producers that convert price into volume and margin.
      confidence: high

textiles:
  label: Textiles
  regime: Sourcing agility and clean channel inventory are central as tariffs collide with consumer price resistance.
  rules:
    - id: TEXTILES_1
      trigger: Sourcing and tariff actions preserve gross margin without order cancellations or inventory buildup.
      implication: positive
      rationale: Diversified sourcing and contracted pricing make pass-through more durable.
      confidence: medium_high
    - id: TEXTILES_2
      trigger: Sales growth comes from price while unit volume, retailer reorders, or utilization decline.
      implication: negative
      rationale: Consumer value migration makes price-led growth fragile and raises downstream markdown risk.
      confidence: medium_high
    - id: TEXTILES_3
      trigger: Inventory days and promotional allowances fall while margin and cash conversion improve.
      implication: positive
      rationale: Clean channel inventory is the best confirmation that production matches end demand.
      confidence: medium

other_materials:
  label: Other Materials
  regime: Physical volume, price-cost spread, cash conversion, and contracted capex separate real growth from inflation.
  rules:
    - id: OTHER_MATERIALS_1
      trigger: Price-cost spread improves while volumes remain positive across end markets.
      implication: positive
      rationale: Balanced volume and margin improvement is the cleanest signal under manufacturing expansion and elevated inputs.
      confidence: medium_high
    - id: OTHER_MATERIALS_2
      trigger: Sales rise through commodity inflation while physical volume and FCF decline.
      implication: negative
      rationale: Nominal growth does not establish demand or value creation without cash conversion.
      confidence: high
    - id: OTHER_MATERIALS_3
      trigger: Maintenance or capacity capex rises without contracted demand or quantified payback.
      implication: negative
      rationale: Funding and monetization scrutiny extends beyond tech to long-dated materials projects.
      confidence: medium_high

