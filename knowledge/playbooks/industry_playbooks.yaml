# =============================================================================
# Enrgy — Energy (E&P, integrated, midstream, services) · ~4% of events
# =============================================================================
Enrgy:
  label: Energy
  regime: >
    The exact INVERSE of the tech capex dynamic. Q1 E&P profits doubled on the
    oil spike (WTI +77% YTD, above $90/bbl), yet the sector held spending
    discipline — 36 tracked companies set 2026 capex at $59.1bn, DOWN 5%.
    Chasing the windfall with a capex surge "would have been a losing bet."
    NOTE FROM OUR OWN RESULTS: we systematically under-predicted E&P and
    midstream on Aug 6 (TRGP +3.3%, MGY +4.5%, WTI +2.9%, REPX +3.4%,
    CHRD +2.1% — all forecast below 0.20, all landed 0.61-0.74). With oil
    elevated, a solid cash-flow quarter is a modest POSITIVE. The discipline
    rule was over-firing.

  rules:
    - id: ENRGY-CASH-01
      type: setter
      scope: {profile: e_and_p_or_midstream}
      trigger: >
        Solid cash flow and production in line or better, capital discipline
        maintained, no negative surprise.
      action:
        abnormal_return_pct: [1.5, 5.0]
        percentile_range: [0.58, 0.76]
      rationale: >
        ADDED IN v0.2.0 IN RESPONSE TO OUR OWN ERRORS. With oil sustained above
        $90, an unremarkable energy quarter generates strong cash and drifts
        UP. We were forecasting these below 0.20; the truth was 0.61-0.74.
      confidence: high
      source: observed_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: ENRGY-DISC-01
      type: modifier
      scope: {profile: e_and_p}
      trigger: >
        Capital discipline maintained or reaffirmed despite elevated cash
        flows, windfall directed to distributions or buybacks.
      action: {adjust_return_pp: 2.5}
      rationale: >
        The sector-defining behaviour this cycle. Investors explicitly reward
        restraint over growth-chasing.
      confidence: high
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: ENRGY-DISC-02
      type: setter
      scope: {profile: e_and_p}
      trigger: >
        Capex budget raised MATERIALLY to chase current strip prices.
        GATE: a genuine budget increase above the prior plan. Routine
        reaffirmation, inflation-driven cost adjustments, or maintenance
        capex do NOT fire this rule. This was over-firing in v0.1.
      action:
        abnormal_return_pct: [-9.0, -3.2]
        percentile_range: [0.14, 0.32]
      rationale: >
        Direct inverse of BUSEQ-CAPEX-01 and the reason a single global capex
        rule would be actively wrong. Breaking discipline is punished even when
        cash flows appear to justify it.
      confidence: high
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: ENRGY-MID-01
      type: modifier
      scope: {profile: midstream}
      trigger: >
        Fee-based, inflation-protected contract structure reaffirmed with
        stable volumes.
      action: {adjust_return_pp: 1.5}
      rationale: >
        Midstream cash flows have grown consistently through tariff threats,
        geopolitical flare-ups and OPEC+ uncertainty. Stability is the product.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

# =============================================================================
# Utils — Utilities · ~3% of events
# =============================================================================
Utils:
  label: Utilities
  regime: >
    Data-centre load story is real — US data-centre electricity demand
    projected to triple 2024-2030 (3% to 10% of total, ~125 GW added, 4.1%
    CAGR). BUT forecasts are being TRIMMED: EIA cut its 2026 generation
    forecast by more than a percentage point and slashed expected ERCOT growth
    from 15.7% to 9.6%. Affordability is emerging as a political constraint.
    Utilities are low-beta: realized moves are usually small. Our Aug 6 sample
    shows most utilities landing 0.30-0.65 with CAR between -3% and +3%. Do not
    forecast dramatic moves here without a dramatic cause.

  rules:
    - id: UTILS-DC-01
      type: modifier
      scope: {applies_to: all}
      trigger: >
        Data-centre load agreement announced WITHOUT clarity on cost
        allocation, rate recovery, or regulatory approval.
      action: {adjust_return_pp: -1.5}
      rationale: >
        A data-centre contract is no longer an automatic positive. The market
        asks who bears the cost and whether regulators will permit recovery.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: UTILS-DC-02
      type: modifier
      scope: {applies_to: all}
      trigger: >
        Large-load growth paired with a constructive rate-case outcome or
        explicit cost-recovery mechanism.
      action: {adjust_return_pp: 2.5}
      rationale: >
        Resolved regulatory risk converts the load-growth story into earnings
        the market will pay for.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: UTILS-FCF-01
      type: setter
      scope: {applies_to: all}
      trigger: >
        Volume or load growth strong BUT free cash flow guidance not raised, or
        capex needs escalating.
      action:
        abnormal_return_pct: [-4.7, -1.2]
        percentile_range: [0.25, 0.43]
      rationale: >
        Defensive yield names. The market weighs free cash flow and cost
        recovery above headline growth; unfunded growth reads as a
        balance-sheet demand rather than an earnings story.
      confidence: high
      source: koijen_levy_2026
      evidence: {n: 0, hit_rate: null}

    - id: UTILS-BETA-01
      type: modifier
      scope: {applies_to: all}
      trigger: Applies to all regulated utilities.
      action: {compress: true, magnitude_pp: 2.0}
      rationale: >
        Regulated utilities are structurally low-beta and rarely produce
        extreme earnings-day moves. Pull estimates toward the middle unless
        there is a genuine shock such as an adverse rate case or a dividend
        cut. This is the one place where compressing toward 0.50 is correct.
      confidence: high
      source: observed_2026Q3
      evidence: {n: 0, hit_rate: null}

# =============================================================================
# Telcm — Telecommunications · ~2% of events
# =============================================================================
Telcm:
  label: Telecommunications
  regime: >
    Sector "finally looks healthier." Verizon: 184k postpaid phone nets vs 106k
    consensus, churn down 6bps to 0.84%, 1H FCF $10.2bn vs $8.8bn. AT&T rose
    >3% on convergence — 42% of home internet customers also take wireless.
    T-Mobile is the counter-example: EPS beat >15% and FCF guidance raised, but
    postpaid net accounts fell 13% YoY. Churn direction, FCF and convergence
    outrank gross subscriber adds.

  rules:
    - id: TELCM-CHURN-01
      type: setter
      scope: {applies_to: all}
      trigger: >
        Churn rises, or free cash flow guidance is not raised — regardless of
        strong subscriber net additions.
      action:
        abnormal_return_pct: [-4.7, -0.7]
        percentile_range: [0.25, 0.45]
      rationale: >
        Defensive yield stocks where the market fears competitive intensity
        more than it rewards growth. High net adds are routinely ignored if
        churn ticks up.
      confidence: high
      source: koijen_levy_2026
      evidence: {n: 0, hit_rate: null}

    - id: TELCM-CONV-01
      type: setter
      scope: {applies_to: all}
      trigger: >
        Convergence metrics improving — rising share of customers taking both
        wireless and home internet — with churn falling and FCF growing.
      action:
        abnormal_return_pct: [2.0, 6.0]
        percentile_range: [0.61, 0.80]
      rationale: >
        Upgraded from modifier. The validated thesis of the quarter: AT&T rose
        over 3% on exactly this combination, Verizon delivered the same mix.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: TELCM-DECEL-01
      type: modifier
      scope: {applies_to: all}
      trigger: >
        EPS or FCF beats but subscriber net additions decelerate materially YoY.
      action: {adjust_return_pp: -2.0}
      rationale: >
        The T-Mobile pattern: a large EPS beat and raised FCF guidance
        alongside a 13% YoY decline in postpaid net accounts is weaker than the
        headline implies.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

