# =============================================================================
# industry_playbooks.yaml — sector rulebooks
# Explaining Markets · Q3 2026 · version 0.2.0 · owner: ahi · 2026-08-08
# =============================================================================
# CHANGELOG v0.1.0 -> v0.2.0 (see docs/EM-Diagnostics-Aug6.md)
#   1. Every action now carries BOTH abnormal_return_pct (for predict_v1) and
#      percentile_range (for predict_v0), so the A/B test stays valid.
#   2. Materiality gates added to triggers that were firing on ordinary
#      quarters.
#   3. Positive setters added to every major sector. v0.1 was overwhelmingly
#      negative and the agent was blind to upside.
#   4. Q3-CAL-02 (blanket -0.05 on anything resembling a miss) TIGHTENED — it
#      was compounding an already-negative rulebook.
#
# LOADER CONTRACT — unchanged
#   Filter to the event's FF12 industry key, then pass BOTH that industry's
#   `regime` block and its `rules` into {industry_rules}. ALWAYS also include
#   `quarter_calibration` — it sits alongside the industry keys, not inside
#   one, and applies to every event.
#
# SOURCE TAGS
#   koijen_levy_2026 / observed_2026Q3 / regime_2026Q3 / literature / team_prior
#   Most rules here are regime_2026Q3 and DECAY. Re-research in September.
# =============================================================================

meta:
  version: 0.2.0
  as_of: 2026-08-08
  research_basis: docs/Q3-2026-Sector-Research-Briefing.md
  evidence_basis: docs/EM-Diagnostics-Aug6.md
  next_review: 2026-09-01
  taxonomy: fama_french_12

# -----------------------------------------------------------------------------
# CROSS-SECTOR CALIBRATION — applies to every event this quarter
# -----------------------------------------------------------------------------
quarter_calibration:
  - id: Q3-CAL-01
    type: modifier
    trigger: applies to all events this quarter
    action: {widen: true, magnitude_pp: 1.5}
    rationale: >
      Single-stock dispersion (DSPX) is at a six-year high of ~47%, above the
      April peak, while VIX sits near its median at ~18. Index-level calm is
      masking violent single-stock divergence. Do not compress return
      estimates toward zero — genuine dispersion is elevated.
    confidence: high
    source: regime_2026Q3

  - id: Q3-CAL-02
    type: modifier
    trigger: >
      A MATERIAL miss or guidance cut — one that changes the forward earnings
      picture.
      TIGHTENED IN v0.2.0: this previously fired on anything resembling a miss
      and was compounding an already over-negative rulebook. It does NOT fire
      on a small headline miss, an in-line quarter framed cautiously, or a
      miss the market had already anticipated.
    action: {adjust_return_pp: -1.5}
    rationale: >
      Genuine negative asymmetry this season — beats are rewarded but material
      misses trigger severe selloffs against elevated expectations. The
      asymmetry is real; it just should not apply to every event.
    confidence: medium
    source: regime_2026Q3

  - id: Q3-CAL-03
    type: modifier
    trigger: >
      Management gives material commentary on input costs, fuel, freight, raw
      materials, or interest-rate sensitivity.
    action: {widen: true, magnitude_pp: 1.0}
    rationale: >
      An oil shock (WTI +77% YTD, sustained above $90/bbl) and a contested Fed
      path are the shared macro shock. Cost and rate commentary is being
      listened to more closely than usual.
    confidence: medium
    source: regime_2026Q3

  - id: Q3-CAL-04
    type: modifier
    trigger: >
      The company is small-cap, thinly covered, or has low institutional
      ownership.
    action: {widen: true, magnitude_pp: 2.0}
    rationale: >
      Observed directly in our Aug 6 results: the largest realized moves in
      both directions were concentrated in small caps (HTZ +29.6%, OPRT +33.0%,
      IBTA +50.0%, TDUP -50.3%, UTI -34.1%). Large caps clustered near the
      middle. Position size drives realized dispersion, and this is one of the
      most reliable cross-sectional signals available to us.
    confidence: high
    source: observed_2026Q3

# =============================================================================
# BusEq — Business Equipment (tech, semiconductors, software)
# Largest bucket: ~20% of events
# =============================================================================
BusEq:
  label: Business Equipment
  regime: >
    THREE SUB-REGIMES THAT POINT IN OPPOSITE DIRECTIONS. Identify which one the
    company belongs to before applying any rule.
    (a) Hyperscalers/AI infrastructure: capex is scrutinised as a liability,
        not celebrated as growth. The market wants revenue proof and funding
        clarity.
    (b) Semiconductors/memory: strongest tape in the market ("memflation"), but
        the bar is extremely high — in-line guidance reads as a miss.
    (c) Seat-based software: structural de-rating as AI reduces seat counts.
        Retention and seat trends outrank headline results.

  rules:
    - id: BUSEQ-CAPEX-01
      type: setter
      scope: {profile: hyperscaler_or_ai_infra}
      trigger: >
        Capex guidance raised MATERIALLY without corresponding revenue
        visibility or a clear monetization path.
        GATE: a material increase above the prior plan, not a reaffirmation.
      action:
        abnormal_return_pct: [-10.0, -4.0]
        percentile_range: [0.12, 0.28]
      rationale: >
        Alphabet reported accelerating cloud growth on 2026-07-28 and was
        panned for hiking 2026 capex, dragging Amazon, Meta and Microsoft down
        with it. Hyperscaler 2026 capex consensus rose $467bn to $533bn across
        the season and was received badly. REVERSES the 2023-25 pattern.
      confidence: high
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: BUSEQ-CAPEX-02
      type: modifier
      scope: {profile: hyperscaler_or_ai_infra}
      trigger: >
        Capex increase explicitly paired with disclosed contracted revenue,
        backlog, or utilization metrics demonstrating the spend converts.
      action: {adjust_return_pp: 3.0}
      rationale: >
        Return dispersion within the group keys off whether investors believe
        the AI investment produces revenue. Proof is rewarded; assertion is not.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: BUSEQ-CAPEX-03
      type: modifier
      scope: {profile: hyperscaler_or_ai_infra}
      trigger: Capex funded with materially increased leverage or debt issuance.
      action: {adjust_return_pp: -2.0}
      rationale: >
        Funding structure is an explicit component of the widening return
        dispersion across hyperscalers this season.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: BUSEQ-SEMI-01
      type: setter
      scope: {profile: semiconductor}
      trigger: >
        Guidance merely in line with consensus, or a modest beat, in a name
        priced for acceleration.
      action:
        abnormal_return_pct: [-9.0, -3.5]
        percentile_range: [0.14, 0.31]
      rationale: >
        Broadcom guided Q3 AI chip revenue to $16bn against $17.2bn consensus
        and fell 14% in a session on 2026-06-04. In this sector an in-line
        guide functions as a miss.
      confidence: high
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: BUSEQ-SEMI-04
      type: setter
      scope: {profile: semiconductor}
      trigger: >
        Guidance meaningfully ABOVE an already elevated bar, with AI or
        data-centre demand quantified and supply secured.
      action:
        abnormal_return_pct: [8.0, 18.0]
        percentile_range: [0.85, 0.94]
      rationale: >
        The mirror of BUSEQ-SEMI-01, absent from v0.1. In the strongest tape in
        the market, clearing a high bar is rewarded proportionately — Micron
        +104% over six months, MTSI +14.6%, DIOD +15.5% in our own sample.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: BUSEQ-SEMI-02
      type: modifier
      scope: {profile: semiconductor}
      trigger: >
        Memory/storage producer (DRAM, NAND, HBM) confirming continued pricing
        strength or supply tightness.
      action: {adjust_return_pp: 2.5}
      rationale: >
        Memflation: DRAM +125% and NAND +234% in 2026, supply constrained with
        no relief expected until late 2027.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: BUSEQ-SEMI-03
      type: modifier
      scope: {profile: hardware_device_assembler}
      trigger: >
        Company CONSUMES memory/storage as an input and flags rising component
        costs or margin pressure.
      action: {adjust_return_pp: -2.5}
      rationale: >
        The other side of memflation. Component inflation compresses margins
        for device makers, who cannot fully pass it through.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: BUSEQ-SW-01
      type: setter
      scope: {profile: seat_based_software}
      trigger: >
        Evidence of seat compression, softening net revenue retention,
        lengthening sales cycles, or customers consolidating licenses — even
        alongside a headline revenue beat.
        GATE: an actual deterioration in the metric, not generic commentary
        about a competitive environment.
      action:
        abnormal_return_pct: [-12.0, -5.0]
        percentile_range: [0.10, 0.25]
      rationale: >
        The SaaSpocalypse. Software lost over $1tn of value in 2026 because
        AI-equipped customers accomplish more with fewer licenses.
      confidence: high
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: BUSEQ-SW-02
      type: setter
      scope: {profile: seat_based_software}
      trigger: >
        Net revenue retention stable or improving, OR credible quantified
        migration to usage-based/hybrid pricing, OR quantified AI-attributable
        revenue.
      action:
        abnormal_return_pct: [5.0, 14.0]
        percentile_range: [0.77, 0.92]
      rationale: >
        Upgraded from modifier to setter. With the whole sector de-rating on
        the seat-compression thesis, evidence AGAINST that thesis is a
        powerful positive — it removes a discount applied to the entire group.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: BUSEQ-ROADMAP-01
      type: modifier
      scope: {applies_to: all}
      trigger: >
        Positive narrative rests on distant product roadmap or multi-year
        vision rather than delivered financials.
      action: {adjust_return_pp: -2.0}
      rationale: >
        High-growth technology names carry large premiums; roadmap items years
        away are discounted as vaporware.
      confidence: high
      source: koijen_levy_2026
      evidence: {n: 0, hit_rate: null}

# =============================================================================
# Hlth — Health (pharma, biotech, devices, providers) · ~17% of events
# =============================================================================
Hlth:
  label: Health
  regime: >
    Pricing overhang has PARTLY cleared — most large drugmakers signed pricing
    agreements and the sector recovered over recent months. But the cost is now
    quantified, so calls are read for whether volume growth outruns price
    concession. Large pharma and pre-profit biotech behave like different asset
    classes: split them first. Biotech produced several of the largest moves in
    our Aug 6 sample in BOTH directions (IOVA +43.2%, INSM +34.0%,
    DCTH +22.6%; AKBA -25.9%, COLL -18.4%).

  rules:
    - id: HLTH-BIO-01
      type: modifier
      scope: {profile: pre_profit_biotech}
      trigger: >
        A clinical readout, regulatory decision, or partnership catalyst is
        disclosed on the call.
      action: {widen: true, magnitude_pp: 8.0}
      rationale: >
        For pre-profit biotech a single catalyst swamps the financials
        entirely. These are the highest-variance names in the sample and belong
        in the tails — in either direction.
      confidence: high
      source: literature
      evidence: {n: 0, hit_rate: null}

    - id: HLTH-BIO-03
      type: setter
      scope: {profile: pre_profit_biotech}
      trigger: >
        Positive clinical data, regulatory approval, or a partnership with
        disclosed economics — particularly where the market had doubted the
        program.
      action:
        abnormal_return_pct: [12.0, 35.0]
        percentile_range: [0.90, 0.99]
      rationale: >
        Binary outcomes produce binary moves. Our sample shows the upside tail
        is at least as fat as the downside for this profile, and v0.1 had no
        positive biotech rule at all.
      confidence: medium
      source: observed_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: HLTH-BIO-02
      type: modifier
      scope: {profile: pre_profit_biotech}
      trigger: >
        Cash runway disclosed as under roughly 12 months without a financing
        plan, or a raise signalled.
        EXCEPTION: a financing that RESOLVES a known runway problem is a
        positive — see GLB-POS-01.
      action: {adjust_return_pp: -3.0}
      rationale: >
        Runway risk dominates pipeline optimism for unprofitable biotech.
      confidence: medium
      source: literature
      evidence: {n: 0, hit_rate: null}

    - id: HLTH-GLP1-01
      type: modifier
      scope: {profile: glp1_exposed}
      trigger: >
        Volume/script growth clearly outrunning the disclosed price concession.
      action: {adjust_return_pp: 2.5}
      rationale: >
        GLP-1 remains the sector engine — global obesity sales projected at
        $39.4bn in 2026 — but US price reductions cut obesity revenues $2-3bn
        this year, so the volume/price race is what is being judged.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: HLTH-GLP1-02
      type: setter
      scope: {profile: glp1_exposed}
      trigger: >
        Price concessions biting faster than volume can offset, or guidance
        down on obesity-franchise revenue.
      action:
        abnormal_return_pct: [-9.0, -3.5]
        percentile_range: [0.14, 0.31]
      rationale: >
        The pricing agreements removed uncertainty but installed a quantified
        revenue headwind.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: HLTH-PIPE-01
      type: modifier
      scope: {profile: large_pharma}
      trigger: >
        Pipeline depth reaffirmed with specific near-term catalysts in obesity,
        cell and gene therapy, inflammation, rare disease, neuroscience, or
        next-generation oncology.
      action: {adjust_return_pp: 2.0}
      rationale: >
        Investors are explicitly prioritising durable pipelines with clear
        catalysts, and these are the areas attracting attention.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: HLTH-LOE-01
      type: setter
      scope: {profile: large_pharma}
      trigger: >
        Loss of exclusivity, patent cliff, or key-product erosion discussed
        without a credible quantified replacement.
      action:
        abnormal_return_pct: [-10.0, -4.0]
        percentile_range: [0.12, 0.28]
      rationale: >
        The classic pharma de-rating trigger. The market prices the forward
        revenue base, and an unreplaced cliff resets it.
      confidence: medium
      source: literature
      evidence: {n: 0, hit_rate: null}

# =============================================================================
# Fin — Finance (banks, insurers, asset managers, specialty) · ~16% of events
# =============================================================================
Fin:
  label: Finance
  regime: >
    Margins compressing — NIM fell 3.30% to 3.22% between Q4 2025 and Q1 2026,
    the first NII decline since mid-2024, loan yields down 6.75% to 6.51%.
    Credit broadly benign (CRE and private credit easing, consumer
    delinquencies falling) EXCEPT lower-income/lower-FICO segments. The hawkish
    rate repricing has been a tailwind for bank stocks.
    NOTE FROM OUR OWN RESULTS: we systematically under-predicted insurers on
    Aug 6 (ALL +4.1%, MET +4.0%, PRI +2.0%, HMN +4.0%, FNF +3.0%, AFG +4.7%,
    KMPR +2.1% — all forecast below 0.15, all landed 0.60-0.75). Insurance is
    NOT the same as banking: it does not carry the NIM problem.

  rules:
    - id: FIN-NIM-01
      type: setter
      scope: {profile: bank}
      trigger: >
        Deposit costs rising faster than asset yields, NIM guided lower, or NII
        trajectory softening.
        GATE: applies to BANKS and spread lenders. Does NOT apply to insurers,
        exchanges, asset managers or payment processors.
      action:
        abnormal_return_pct: [-9.0, -3.5]
        percentile_range: [0.14, 0.32]
      rationale: >
        NIM compression is the sector's live problem and deposit pricing is the
        first thing investors are told to watch. This outranks the reported
        quarter.
      confidence: high
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: FIN-NIM-02
      type: setter
      scope: {profile: bank}
      trigger: >
        NIM stabilising or expanding with deposit costs demonstrably contained.
      action:
        abnormal_return_pct: [4.0, 10.0]
        percentile_range: [0.72, 0.88]
      rationale: >
        Upgraded from modifier. Against sector-wide compression, holding margin
        is a genuine differentiator rather than a baseline expectation.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: FIN-INS-01
      type: setter
      scope: {profile: insurer}
      trigger: >
        Insurer reporting solid underwriting results, a stable or improving
        combined ratio, and reserves holding — with no major catastrophe loss.
      action:
        abnormal_return_pct: [1.5, 5.0]
        percentile_range: [0.58, 0.76]
      rationale: >
        ADDED IN v0.2.0 IN RESPONSE TO OUR OWN ERRORS. We forecast seven
        insurers below 0.15 on Aug 6; every one landed 0.60-0.75. Insurers
        benefit from the higher-rate environment through investment income and
        do not carry the NIM compression problem. A clean insurance quarter is
        a modest positive, not a negative.
      confidence: high
      source: observed_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: FIN-CREDIT-01
      type: setter
      scope: {profile: bank_or_specialty_finance}
      trigger: >
        Loan-loss provisions built materially above expectations, or credit
        guidance deteriorating — even with a clean current quarter.
      action:
        abnormal_return_pct: [-12.0, -4.5]
        percentile_range: [0.10, 0.26]
      rationale: >
        Provision builds are management's forward-looking warning. Against a
        benign credit backdrop, an unexpected build is a strong idiosyncratic
        negative.
      confidence: high
      source: literature
      evidence: {n: 0, hit_rate: null}

    - id: FIN-CREDIT-02
      type: modifier
      scope: {profile: consumer_lender}
      trigger: >
        Material exposure to lower-income or lower-FICO segments with any
        deterioration flagged.
      action: {adjust_return_pp: -2.5}
      rationale: >
        The explicitly identified pocket of stress in an otherwise improving
        credit picture.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: FIN-CREDIT-03
      type: modifier
      scope: {profile: bank_or_specialty_finance}
      trigger: >
        Credit metrics better than feared, provisions released, or
        charge-offs improving against a cautious prior.
      action: {adjust_return_pp: 2.5}
      rationale: >
        Mirror of FIN-CREDIT-01. Where the market has priced credit anxiety,
        its absence is a genuine positive.
      confidence: medium
      source: literature
      evidence: {n: 0, hit_rate: null}

    - id: FIN-IB-01
      type: modifier
      scope: {profile: capital_markets_exposed}
      trigger: >
        Investment banking pipeline, deal activity, or trading revenue
        materially exceeding or missing expectations.
      action: {adjust_return_pp: conditional, magnitude: 2.0}
      rationale: >
        Capital markets activity is the third explicit focus area and the most
        volatile revenue line in the sector.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: FIN-BUYBACK-01
      type: modifier
      scope: {applies_to: all}
      trigger: Buyback or capital return announced.
      action: {adjust_return_pp: 0.0}
      rationale: >
        In financials, buybacks are routine capital maintenance rather than new
        positive signals. Explicit no-op. Underwriting discipline (shrinking
        volume to hold price) is similarly often read as a growth headwind.
      confidence: high
      source: koijen_levy_2026
      evidence: {n: 0, hit_rate: null}

# =============================================================================
# Shops — Retail, wholesale, consumer services · ~7% of events
# =============================================================================
Shops:
  label: Shops
  regime: >
    The consumer is visibly cracking. US consumer spending fell by its widest
    margin in four years on tariff shocks, a softening labour market, and a
    flight to value. Walmart guided below expectations and flagged that
    ~$50k-income households are making smaller, paycheck-timed purchases.
    Durable goods prices expected to rise 4.5% in 2026 with increases sticky.
    WARNING: Q1 2026 retail strength was flattered by tax refunds and BNPL, so
    comparisons against it are artificially hard.

  rules:
    - id: SHOPS-GUID-01
      type: setter
      scope: {applies_to: all}
      trigger: >
        Guidance lowered, or management describes consumer weakness, trade-down
        behaviour, smaller baskets, or reduced trip frequency.
        GATE: company-specific deterioration or an actual guidance cut. Generic
        macro caution about "an uncertain consumer environment" appears in
        nearly every retail call this year and is already priced.
      action:
        abnormal_return_pct: [-12.0, -4.7]
        percentile_range: [0.10, 0.25]
      rationale: >
        The sector's live thesis and the market is primed for it. Walmart, Ross
        and TJX guidance collectively pointed to a tougher road.
      confidence: high
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: SHOPS-PRICE-01
      type: setter
      scope: {applies_to: all}
      trigger: >
        Revenue growth driven predominantly by price increases while unit
        volumes or traffic decline.
      action:
        abnormal_return_pct: [-6.5, -3.0]
        percentile_range: [0.20, 0.33]
      rationale: >
        The most likely failure mode in this sector given sticky tariff-driven
        price increases against a weakening consumer.
      confidence: high
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: SHOPS-TRAFFIC-01
      type: setter
      scope: {applies_to: all}
      trigger: >
        Traffic and comparable sales positive with volumes (not just price)
        growing, or guidance raised against the weak sector backdrop.
      action:
        abnormal_return_pct: [5.0, 14.0]
        percentile_range: [0.77, 0.92]
      rationale: >
        ADDED IN v0.2.0. Where the entire sector is priced for consumer
        weakness, evidence of genuine volume growth is a strong differentiator
        — it contradicts the thesis the whole group is discounted for.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: SHOPS-VALUE-01
      type: modifier
      scope: {profile: off_price_or_discount}
      trigger: >
        Value/discount retailer reporting share gains or traffic growth.
      action: {adjust_return_pp: 2.0}
      rationale: >
        The flight to value is a genuine identified reallocation, so share
        gains at the value end are real rather than cyclical noise.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: SHOPS-COMP-01
      type: modifier
      scope: {applies_to: all}
      trigger: >
        Results compared against a Q1 2026 base inflated by tax refunds or
        elevated BNPL usage.
      action: {adjust_return_pp: 1.0}
      rationale: >
        An artificially inflated comparison base means an optically weak comp
        may overstate genuine deterioration.
      confidence: low
      source: team_prior
      evidence: {n: 0, hit_rate: null}

# =============================================================================
# Manuf — Manufacturing and industrials · ~9% of events
# =============================================================================
Manuf:
  label: Manufacturing
  regime: >
    Activity genuinely healthy — ISM PMI 55.6 in July, six straight months of
    expansion. The problem is MARGIN, not demand: tariff transmission lag plus
    a raw-material cost spike in metals and energy. ISM Prices hit 78.3 in
    March before easing to 73.0 in June — still elevated. Demand commentary is
    NOT the swing factor.

  rules:
    - id: MANUF-MARGIN-01
      type: setter
      scope: {applies_to: all}
      trigger: >
        Volume or order growth beats BUT margins compress or management flags
        input-cost pressure it cannot fully pass through.
        GATE: actual margin compression or a quantified guidance impact, not
        generic acknowledgement that input costs exist.
      action:
        abnormal_return_pct: [-9.0, -3.7]
        percentile_range: [0.14, 0.30]
      rationale: >
        Margin squeeze is explicitly at the forefront of investor concern.
        A volume beat with margin compression reads negative.
      confidence: high
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: MANUF-PASS-01
      type: setter
      scope: {applies_to: all}
      trigger: >
        Successful price pass-through demonstrated with margins held or
        expanded despite input-cost inflation.
      action:
        abnormal_return_pct: [4.0, 11.0]
        percentile_range: [0.72, 0.89]
      rationale: >
        Upgraded from modifier. Pricing power is THE scarce quality in this
        environment and separates winners from the sector average. Our own
        sample supports it — PH +7.5%, ITT +5.2%, ATI +9.1%, AVNT +12.6%.
      confidence: medium
      source: regime_2026Q3
      evidence: {n: 0, hit_rate: null}

    - id: MANUF-PROTECT-01
      type: modifier
      scope: {profile: domestic_steel_or_protected}
      trigger: >
        Domestic producer benefiting from the protectionist environment and
        able to push through its own price increases.
      action: {adjust_return_pp: 2.0}
      rationale: >
        Domestic steel producers are positioned as relative winners, able to
        leverage protection and high prices.
      confidence: medium
      source: regime_2026Q3
