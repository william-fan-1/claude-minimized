# industry_playbooks.yaml — sector rulebooks
# Explaining Markets · Q3 2026 · version 0.2.0 · owner: Will · as of 2026-08-07
# =============================================================================
# Layers ON TOP of knowledge/playbooks/_global.yaml. Industry rules WIN over
# global rules on conflict (see _global.yaml precedence, order 1).
#
# LOADER CONTRACT
#   Filter to the event's desired industry and inject industry rules into the
#   prompt
#
# ⚠ Most rules here are regime_2026Q3. This file has a shorter half-life than
#   _global.yaml by design. Treat confidence levels as provisional until the
#   outcomes ledger has real evidence behind them.
# =============================================================================

meta:
  title: Q2 2026 Earnings-Season Industry Playbooks
  as_of: "2026-08-07"
  fiscal_quarter: Q2 2026
  purpose: Three industry-specific trends for predicting cross-sectional stock reactions to earnings.
  calibration: >
    Estimate a continuous one-day abnormal return in percentage points first, then convert
    that estimate to a percentile using the empirical map below. Each action range is a
    calibration reference for a MATERIAL and substantially complete trigger match; it is
    not a prediction setter and its midpoint must not be copied automatically.
  application_policy:
    baseline: Start from 0.0% abnormal return, approximately the 0.50 percentile.
    materiality_gate: >
      Apply an action range only when all important trigger clauses are explicitly supported,
      the development is material versus consensus, prior guidance, or the prior earnings path,
      and there is no equally material offset. Routine caution, one soft segment, normal hedging,
      or a small one-time item is directional evidence only and must not activate a tail range.
    return_first: >
      Choose a specific abnormal-return estimate from the magnitude of the disclosed surprise,
      guidance change, KPI inflection, expectation bar, and credible offsets. Convert that point
      estimate mechanically to a percentile only after the return estimate is complete.
    partial_match: >
      If evidence is incomplete, mixed, or merely qualitative, shrink toward 0.0% abnormal
      return. Ordinary mixed quarters generally belong between -2.0% and +3.0%, approximately
      the 0.38-0.68 percentile region.
    tail_gate: >
      Forecast below -10% or above +12% only for explicit thesis-changing evidence such as a
      material guidance reset, major KPI break or inflection, liquidity event, binary catalyst,
      or a result far beyond an elevated expectation bar.
    interaction: >
      Collapse overlapping rules into one economic driver and do not add their ranges. Resolve
      conflicts in return space using this hierarchy: thesis break or liquidity event; material
      guidance change; industry KPI inflection; earnings quality and mix; tone and one-time items.
      Several weak signals do not equal one severe signal.
    strengthening: Move toward the relevant edge only when trigger severity is quantified.
    fading: Shrink toward 0.0% rather than jumping to a separate canned band.
  empirical_percentile_map:
    - {abnormal_return_pct: -31.0, percentile: 0.01}
    - {abnormal_return_pct: -17.5, percentile: 0.05}
    - {abnormal_return_pct: -12.0, percentile: 0.10}
    - {abnormal_return_pct: -8.8, percentile: 0.15}
    - {abnormal_return_pct: -6.6, percentile: 0.20}
    - {abnormal_return_pct: -4.7, percentile: 0.25}
    - {abnormal_return_pct: -3.7, percentile: 0.30}
    - {abnormal_return_pct: -2.6, percentile: 0.35}
    - {abnormal_return_pct: -1.6, percentile: 0.40}
    - {abnormal_return_pct: -0.7, percentile: 0.45}
    - {abnormal_return_pct: 0.0, percentile: 0.50}
    - {abnormal_return_pct: 1.0, percentile: 0.55}
    - {abnormal_return_pct: 1.9, percentile: 0.60}
    - {abnormal_return_pct: 2.7, percentile: 0.65}
    - {abnormal_return_pct: 3.4, percentile: 0.70}
    - {abnormal_return_pct: 4.7, percentile: 0.75}
    - {abnormal_return_pct: 6.0, percentile: 0.80}
    - {abnormal_return_pct: 8.0, percentile: 0.85}
    - {abnormal_return_pct: 12.0, percentile: 0.90}
    - {abnormal_return_pct: 19.0, percentile: 0.95}
    - {abnormal_return_pct: 33.0, percentile: 0.99}
  evidence_base:
    - Q3-2026-Sector-Research-Briefing.MD
    - EM-Diagnostics-Aug6.md
    - Public company earnings releases and market-reaction reporting available through 2026-08-07

quarter_calibration:
  - id: Q3-CAL-01
    trigger: applies to all events this quarter
    calibration_effect: {tail_risk: elevated, automatic_adjustment: false}
    rationale: >
      Single-stock dispersion (DSPX) is at a six-year high of ~47%, above the
      April "Liberation Day" peak, while VIX sits near its median at ~18.
      Index-level calm is masking violent single-stock divergence. Tails are
      genuinely fatter this quarter, but use tails only when company-specific
      evidence passes the materiality and tail gates.
    confidence: high

  - id: Q3-CAL-02
    trigger: >
      Event contains a material miss, guidance cut, or clear forward negative surprise
    calibration_effect: {downside_asymmetry: elevated, automatic_adjustment: false}
    rationale: >
      Explicit negative asymmetry this season: beats are rewarded, but even
      material misses are triggering severe selloffs against elevated
      expectations. This is a severity consideration, not a mechanical percentile deduction.
    confidence: medium

  - id: Q3-CAL-03
    trigger: >
      Management gives material commentary on input costs, fuel, freight,
      raw materials, or interest-rate sensitivity
    calibration_effect: {macro_sensitivity: elevated, automatic_adjustment: false}
    rationale: >
      An oil shock (WTI +77% YTD, sustained above $90/bbl) and a contested
      Fed path are the shared macro shock. Cost and rate commentary is being
      listened to far more closely than in a normal quarter. Commentary changes
      the estimate only when it materially alters the forward earnings path.
    confidence: medium

commercial_products:
  label: Commercial Products
  regime: Healthy industrial demand makes price-cost execution and margin conversion the differentiators.
  rules:
    - id: COMMERCIAL_PRODUCTS_1
      trigger: Volume growth with maintained or expanded margin despite tariffs and metals/energy inflation.
      action:
        abnormal_return_pct: [5.5, 14.8]
        percentile_range: [0.78, 0.92]
      rationale: Caterpillar paired 24% revenue growth with a 21.9% adjusted operating margin; pass-through is scarcer than demand.
      confidence: high
    - id: COMMERCIAL_PRODUCTS_2
      trigger: Revenue or volume beats but margin guidance falls because price realization lags input costs.
      action:
        abnormal_return_pct: [-14.2, -5.1]
        percentile_range: [0.08, 0.24]
      rationale: With manufacturing expanding, negative price-cost increasingly reads as a company-specific execution failure.
      confidence: high
    - id: COMMERCIAL_PRODUCTS_3
      trigger: Backlog and orders rise with higher production or EPS guidance and controlled working capital.
      action:
        abnormal_return_pct: [3.9, 10.4]
        percentile_range: [0.72, 0.88]
      rationale: Backlog conversion validates durable demand; advance ordering or cash absorption lowers its quality.
      confidence: medium_high

commercial_services:
  label: Commercial Services
  regime: Organic demand remains resilient, but labor productivity and measurable automation determine earnings quality.
  rules:
    - id: COMMERCIAL_SERVICES_1
      trigger: Organic growth accompanies stable retention, utilization, and labor-adjusted margin.
      action:
        abnormal_return_pct: [1.0, 3.4]
        percentile_range: [0.55, 0.70]
      rationale: A productivity-backed beat is more repeatable than one produced by pricing or temporary labor underspend.
      confidence: medium
    - id: COMMERCIAL_SERVICES_2
      trigger: Revenue beats mainly through price while transactions, billable volume, or utilization decline.
      action:
        abnormal_return_pct: [-9.4, -3.3]
        percentile_range: [0.14, 0.32]
      rationale: Price-only growth is vulnerable when contracts reset and is poor evidence of healthy end demand.
      confidence: medium
    - id: COMMERCIAL_SERVICES_3
      trigger: AI or automation savings are quantified and flow into margin or guidance.
      action:
        abnormal_return_pct: [3.1, 7.6]
        percentile_range: [0.68, 0.84]
      rationale: Investors reward visible cost-to-serve improvement, not unquantified AI narratives or recurring restructuring.
      confidence: medium

commercial_transportation:
  label: Commercial Transportation
  regime: Oil is the dominant shock; core volume and operating efficiency must be separated from fuel-surcharge revenue.
  rules:
    - id: COMMERCIAL_TRANSPORTATION_1
      trigger: Contractual pricing and fuel surcharges offset higher fuel costs while core volumes remain stable.
      action:
        abnormal_return_pct: [3.1, 7.6]
        percentile_range: [0.68, 0.84]
      rationale: Formulaic cost recovery protects earnings without requiring a favorable oil forecast.
      confidence: high
    - id: COMMERCIAL_TRANSPORTATION_2
      trigger: Headline revenue rises on fuel surcharges while core shipments and operating ratio deteriorate.
      action:
        abnormal_return_pct: [-12.0, -4.5]
        percentile_range: [0.10, 0.26]
      rationale: Surcharge revenue is not demand and can conceal network or shipment weakness.
      confidence: high
    - id: COMMERCIAL_TRANSPORTATION_3
      trigger: Productivity and service gains improve the operating ratio and support raised guidance despite fuel inflation.
      action:
        abnormal_return_pct: [5.0, 12.0]
        percentile_range: [0.76, 0.90]
      rationale: Durable network efficiency is more valuable than nominal revenue in an oil shock.
      confidence: high

other_business_products_and_services:
  label: Other Business Products and Services
  regime: Visibility and profit conversion matter more than acquisition-led or nominal growth.
  rules:
    - id: OTHER_BUSINESS_PRODUCTS_AND_SERVICES_1
      trigger: Recurring revenue, renewals, and backlog rise while gross margin holds.
      action:
        abnormal_return_pct: [1.0, 3.4]
        percentile_range: [0.55, 0.70]
      rationale: Multi-quarter renewal strength gives more visibility than a one-quarter revenue beat.
      confidence: medium
    - id: OTHER_BUSINESS_PRODUCTS_AND_SERVICES_2
      trigger: Growth is acquisition-led while organic sales stagnate and leverage rises.
      action:
        abnormal_return_pct: [-8.4, -2.8]
        percentile_range: [0.16, 0.34]
      rationale: Two-sided rates reduce the value of debt-funded inorganic growth and increase execution risk.
      confidence: medium
    - id: OTHER_BUSINESS_PRODUCTS_AND_SERVICES_3
      trigger: Revenue guidance rises but profit guidance does not because tariffs, freight, or labor consume incremental sales.
      action:
        abnormal_return_pct: [-12.0, -4.1]
        percentile_range: [0.10, 0.28]
      rationale: Industrial investors are prioritizing margin pass-through over demand commentary.
      confidence: high

apparel_and_accessories:
  label: Apparel and Accessories
  regime: Brand heat, full-price DTC demand, and inventory cleanliness separate winners from promotion-dependent brands.
  rules:
    - id: APPAREL_AND_ACCESSORIES_1
      trigger: North American traffic and comps weaken and sales guidance is cut despite an expense-driven EPS beat.
      action:
        abnormal_return_pct: [-16.4, -5.8]
        percentile_range: [0.06, 0.22]
      rationale: Under Armour's revenue miss, 9% North America decline, and guide cut outweighed its EPS beat.
      confidence: high
    - id: APPAREL_AND_ACCESSORIES_2
      trigger: Broad-based DTC and e-commerce growth accompanies lower inventory, gross-margin expansion, and raised guidance.
      action:
        abnormal_return_pct: [5.0, 13.4]
        percentile_range: [0.76, 0.91]
      rationale: Levi's 11% DTC growth, 19% e-commerce growth, and 7% inventory decline demonstrated profitable brand demand.
      confidence: high
    - id: APPAREL_AND_ACCESSORIES_3
      trigger: Growth depends on promotions or price reductions while assortment rationalization remains unfinished.
      action:
        abnormal_return_pct: [-10.7, -3.3]
        percentile_range: [0.12, 0.32]
      rationale: Persistent discounting signals weak brand equity and threatens the durability of margin recovery.
      confidence: medium_high

consumer_durables:
  label: Consumer Durables
  regime: Innovation can overcome weak discretionary demand, but housing, rates, tariffs, and unit elasticity remain major risks.
  rules:
    - id: CONSUMER_DURABLES_1
      trigger: New-product innovation drives multi-category growth and an upward sales and EPS revision.
      action:
        abnormal_return_pct: [6.0, 17.6]
        percentile_range: [0.80, 0.94]
      rationale: SharkNinja's 22% sales growth and raised outlook showed that real innovation can create a replacement cycle.
      confidence: high
    - id: CONSUMER_DURABLES_2
      trigger: Big-ticket orders soften because of housing turnover, financing costs, or consumer caution.
      action:
        abnormal_return_pct: [-14.2, -4.7]
        percentile_range: [0.08, 0.25]
      rationale: Durable demand is unusually rate-sensitive while expected price increases compound affordability pressure.
      confidence: high
    - id: CONSUMER_DURABLES_3
      trigger: Tariff refunds or temporary price increases lift EPS while underlying units and recurring margin fail to improve.
      action:
        abnormal_return_pct: [-4.1, -0.7]
        percentile_range: [0.28, 0.45]
      rationale: One-time tariff benefits and accounting timing should be removed before extrapolating earnings quality.
      confidence: medium_high

consumer_non_durables:
  label: Consumer Non-Durables
  regime: Volume-supported organic growth is rewarded; price-only sales and input-cost leakage are not.
  rules:
    - id: CONSUMER_NON_DURABLES_1
      trigger: Organic growth is volume or concentrate-led, margins expand, and guidance rises.
      action:
        abnormal_return_pct: [3.9, 10.4]
        percentile_range: [0.72, 0.88]
      rationale: Coca-Cola's volume-supported organic growth and margin expansion showed resilient underlying demand.
      confidence: high
    - id: CONSUMER_NON_DURABLES_2
      trigger: Sales rise primarily through pricing while unit volumes contract or trade-down accelerates.
      action:
        abnormal_return_pct: [-8.4, -2.8]
        percentile_range: [0.16, 0.34]
      rationale: Price-only growth signals elasticity, private-label substitution, and future promotional reinvestment.
      confidence: high
    - id: CONSUMER_NON_DURABLES_3
      trigger: Input inflation or distribution spending causes margin to decline despite positive volume.
      action:
        abnormal_return_pct: [-4.7, -1.1]
        percentile_range: [0.25, 0.43]
      rationale: Positive volume is insufficient if oil, packaging, and tariff costs prevent earnings conversion.
      confidence: medium_high

media:
  label: Media
  regime: Streaming monetization and franchise flywheels are rewarded; linear-ad erosion and cost-only EPS beats are punished.
  rules:
    - id: MEDIA_1
      trigger: Streaming engagement, advertising, and subscription monetization accelerate together.
      action:
        abnormal_return_pct: [4.4, 12.0]
        percentile_range: [0.74, 0.90]
      rationale: Roku's beat across advertising and subscriptions showed scalable platform monetization.
      confidence: high
    - id: MEDIA_2
      trigger: Linear advertising or studio revenue falls sharply even if cost cuts produce an EPS beat.
      action:
        abnormal_return_pct: [-12.0, -3.9]
        percentile_range: [0.10, 0.29]
      rationale: Warner Bros. Discovery's surprise profit did not offset a 39% studio decline and 22% ad decline.
      confidence: high
    - id: MEDIA_3
      trigger: A hit franchise drives measurable lift across box office, streaming, merchandise, and experiences.
      action:
        abnormal_return_pct: [3.4, 9.6]
        percentile_range: [0.70, 0.87]
      rationale: Cross-platform monetization improves content ROI and reduces dependence on a single release window.
      confidence: high

restaurants_hotels_and_leisure:
  label: Restaurants, Hotels and Leisure
  regime: Experiences and premium demand remain resilient, while mass-market restaurant traffic is increasingly value-sensitive.
  rules:
    - id: RESTAURANTS_HOTELS_AND_LEISURE_1
      trigger: Comparable sales or RevPAR and traffic beat while full-year growth or margin guidance rises.
      action:
        abnormal_return_pct: [5.0, 14.8]
        percentile_range: [0.76, 0.92]
      rationale: Airbnb and Hyatt paired demand strength with forward confirmation rather than relying on a backward-looking beat.
      confidence: high
    - id: RESTAURANTS_HOTELS_AND_LEISURE_2
      trigger: Restaurant comps are price-led with weak traffic or management pivots toward value offers.
      action:
        abnormal_return_pct: [-10.7, -3.5]
        percentile_range: [0.12, 0.31]
      rationale: Promotion-dependent visits threaten restaurant-level margins and expose lower-income weakness.
      confidence: high
    - id: RESTAURANTS_HOTELS_AND_LEISURE_3
      trigger: Premium, international, or event demand offsets lower-income domestic weakness with stable margins.
      action:
        abnormal_return_pct: [2.7, 7.2]
        percentile_range: [0.65, 0.83]
      rationale: Consumer demand is bifurcated rather than uniformly weak, favoring affluent and international exposure.
      confidence: medium_high

retail:
  label: Retail
  regime: Traffic, units, basket quality, value positioning, and inventory discipline outrank nominal sales growth.
  rules:
    - id: RETAIL_1
      trigger: Traffic, transactions, or units weaken and guidance falls even where price or mix preserves sales.
      action:
        abnormal_return_pct: [-17.5, -6.6]
        percentile_range: [0.05, 0.20]
      rationale: Paycheck-timed trips and smaller baskets make unit weakness a leading indicator of further pressure.
      confidence: high
    - id: RETAIL_2
      trigger: Share gains from value positioning accompany disciplined inventory and stable gross margin.
      action:
        abnormal_return_pct: [3.4, 9.6]
        percentile_range: [0.70, 0.87]
      rationale: Inventory discipline distinguishes genuine share gains from promotions or channel stuffing.
      confidence: high
    - id: RETAIL_3
      trigger: Growth relies on tax-refund timing, BNPL usage, or promotion rather than repeatable traffic and units.
      action:
        abnormal_return_pct: [-5.1, -1.1]
        percentile_range: [0.24, 0.43]
      rationale: Borrowing- or timing-supported demand is less persistent and creates difficult comparisons.
      confidence: medium_high

services_non_financial:
  label: Services (Non-Financial)
  regime: Measurable AI productivity and recurring demand are rewarded; price-led revenue and weak utilization are discounted.
  rules:
    - id: SERVICES_NON_FINANCIAL_1
      trigger: AI or self-service automation improves conversion or resolution and flows into margin or guidance.
      action:
        abnormal_return_pct: [3.9, 11.2]
        percentile_range: [0.72, 0.89]
      rationale: Airbnb's 45% automated issue resolution illustrates monetized operating leverage rather than AI narrative.
      confidence: medium_high
    - id: SERVICES_NON_FINANCIAL_2
      trigger: Bookings or utilization weakens among lower-income customers and forward demand is reduced.
      action:
        abnormal_return_pct: [-12.0, -4.1]
        percentile_range: [0.10, 0.28]
      rationale: Discretionary services have little inventory cushion, so weakening bookings rapidly create labor deleverage.
      confidence: medium_high
    - id: SERVICES_NON_FINANCIAL_3
      trigger: Revenue beats through price or pass-through fees while productivity, retention, or recurring bookings deteriorate.
      action:
        abnormal_return_pct: [-4.7, -0.9]
        percentile_range: [0.25, 0.44]
      rationale: Nominal service revenue is low quality when utilization and retention weaken.
      confidence: medium

transportation:
  label: Transportation
  regime: Fuel, unit revenue, premium mix, and capacity discipline determine whether record revenue converts into earnings.
  rules:
    - id: TRANSPORTATION_1
      trigger: Fuel pressure rises materially and EPS guidance is cut despite healthy revenue.
      action:
        abnormal_return_pct: [-15.3, -5.1]
        percentile_range: [0.07, 0.24]
      rationale: American Airlines' record revenue did not offset a fuel-driven earnings outlook cut.
      confidence: high
    - id: TRANSPORTATION_2
      trigger: Yield, RASM, and premium revenue outgrow capacity, enabling higher EPS guidance despite fuel inflation.
      action:
        abnormal_return_pct: [5.0, 13.4]
        percentile_range: [0.76, 0.91]
      rationale: United's unit-revenue strength supported a guide raise despite nearly $6 billion of additional fuel cost.
      confidence: high
    - id: TRANSPORTATION_3
      trigger: Capacity expands without unit-revenue improvement or management discounts to fill seats.
      action:
        abnormal_return_pct: [-9.4, -2.8]
        percentile_range: [0.14, 0.34]
      rationale: Capacity is constructive only when yield and margins hold.
      confidence: high

other_consumer_products_and_services:
  label: Other Consumer Products and Services
  regime: Innovation-led organic demand matters more than price reversals, acquisitions, refunds, or event-driven growth.
  rules:
    - id: OTHER_CONSUMER_PRODUCTS_AND_SERVICES_1
      trigger: Innovation drives demand across several categories and management raises revenue and EPS guidance.
      action:
        abnormal_return_pct: [5.0, 14.8]
        percentile_range: [0.76, 0.92]
      rationale: Broad new-product adoption is strong evidence that growth is company-specific rather than macro-driven.
      confidence: high
    - id: OTHER_CONSUMER_PRODUCTS_AND_SERVICES_2
      trigger: Management reverses price increases or adds promotions because consumers resist tariff-driven pricing.
      action:
        abnormal_return_pct: [-12.0, -3.9]
        percentile_range: [0.10, 0.29]
      rationale: Price reversals combine lower realization with inventory and markdown risk.
      confidence: high
    - id: OTHER_CONSUMER_PRODUCTS_AND_SERVICES_3
      trigger: Reported growth is acquisition-, refund-, or event-driven while the legacy business contracts.
      action:
        abnormal_return_pct: [-4.7, -0.7]
        percentile_range: [0.25, 0.45]
      rationale: Temporary and inorganic effects should be stripped out before extrapolating earnings.
      confidence: medium_high

energy_equipment:
  label: Energy Equipment
  regime: Contracted backlog and aftermarket mix are favored over speculative capacity built for the oil spike.
  rules:
    - id: ENERGY_EQUIPMENT_1
      trigger: Orders and backlog improve without speculative supplier capacity expansion.
      action:
        abnormal_return_pct: [3.4, 8.8]
        percentile_range: [0.70, 0.86]
      rationale: E&P customers are preserving capital discipline, favoring suppliers with firm commitments.
      confidence: medium_high
    - id: ENERGY_EQUIPMENT_2
      trigger: Capex or inventory is raised ahead of firm customer commitments.
      action:
        abnormal_return_pct: [-12.0, -4.5]
        percentile_range: [0.10, 0.26]
      rationale: Suppliers betting on an E&P spending boom risk overcapacity because tracked upstream capex remains lower year over year.
      confidence: high
    - id: ENERGY_EQUIPMENT_3
      trigger: Pricing and recurring aftermarket mix offset steel, freight, and labor inflation.
      action:
        abnormal_return_pct: [3.9, 10.4]
        percentile_range: [0.72, 0.88]
      rationale: Service mix and price-cost execution make margin improvement more durable than one-time shipments.
      confidence: medium_high

exploration_production_and_refining:
  label: Exploration, Production and Refining
  regime: Windfall cash return and operating gains are rewarded; peak-cycle capex expansion is punished.
  rules:
    - id: EXPLORATION_PRODUCTION_AND_REFINING_1
      trigger: Oil or refining windfall is returned through buybacks or dividends while capex stays flat or falls.
      action:
        abnormal_return_pct: [5.5, 14.8]
        percentile_range: [0.78, 0.92]
      rationale: Capital discipline is the sector's clearest preference; Exxon paired $17.2 billion of FCF with $9.4 billion of distributions.
      confidence: high
    - id: EXPLORATION_PRODUCTION_AND_REFINING_2
      trigger: Capex rises to chase current prices without commensurate low-cost production or contracted returns.
      action:
        abnormal_return_pct: [-16.4, -5.8]
        percentile_range: [0.06, 0.22]
      rationale: Large multi-year commitments raise peak-cycle risk and reverse the industry's successful restraint.
      confidence: high
    - id: EXPLORATION_PRODUCTION_AND_REFINING_3
      trigger: Production or throughput guidance rises while unit costs and capex remain controlled.
      action:
        abnormal_return_pct: [4.4, 12.0]
        percentile_range: [0.74, 0.90]
      rationale: Operational gains at ConocoPhillips and Chevron are more persistent than commodity-price beats alone.
      confidence: high

energy_services:
  label: Energy Services
  regime: International and offshore backlog plus service intensity matter more than assumptions of a U.S. shale rebound.
  rules:
    - id: ENERGY_SERVICES_1
      trigger: International or offshore backlog and pricing improve while North American activity remains disciplined.
      action:
        abnormal_return_pct: [3.4, 8.8]
        percentile_range: [0.70, 0.86]
      rationale: Contracted activity is more durable than a spot-driven U.S. capex forecast.
      confidence: medium_high
    - id: ENERGY_SERVICES_2
      trigger: Guidance assumes sharply higher U.S. rigs or completions or adds capacity without customer commitments.
      action:
        abnormal_return_pct: [-14.2, -5.1]
        percentile_range: [0.08, 0.24]
      rationale: Tracked E&P capital investment is down 5% in 2026 despite higher oil.
      confidence: high
    - id: ENERGY_SERVICES_3
      trigger: Service intensity, utilization, and pricing lift margins even on flat rig counts.
      action:
        abnormal_return_pct: [3.1, 7.6]
        percentile_range: [0.68, 0.84]
      rationale: Earnings growth without a volume boom validates technology mix and pricing power.
      confidence: medium

utilities:
  label: Utilities
  regime: Data-center load is real, but regulatory cost recovery and affordability outrank raw demand.
  rules:
    - id: UTILITIES_1
      trigger: A data-center load contract includes customer funding, minimum payments, and explicit regulatory recovery.
      action:
        abnormal_return_pct: [4.4, 10.4]
        percentile_range: [0.74, 0.88]
      rationale: Long-duration take-or-pay terms convert load growth into financeable earnings and limit stranded-asset risk.
      confidence: high
    - id: UTILITIES_2
      trigger: Data-center capex or load forecasts rise without cost-allocation clarity or with concentration risk.
      action:
        abnormal_return_pct: [-12.0, -4.1]
        percentile_range: [0.10, 0.28]
      rationale: EIA forecast cuts and political affordability concerns make unprotected capex a liability.
